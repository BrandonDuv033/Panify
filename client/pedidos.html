<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panify - Hacer Pedido</title>
    <link rel="icon" href="../src/img/Icono Panify.png" type="image/png" />
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
    />

    <link rel="stylesheet" href="../src/css/pedidos.css" />
  </head>
  <body>
    
    <header>
      <nav class="navbar navbar-expand-lg navbar-panify">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-center gap-3">
            <img src="../src/img/Logo Panify.png" alt="Logo Panify" class="logo" onerror="this.src='https://placehold.co/50x35?text=Pan'"/>
            <span class="marca">Pani<span class="marca-dos">fy</span></span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-5">
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">Inicio</a></li>
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">Productos</a></li>
              <li class="nav-item"><a class="nav-link opcion-menu" href="#">Contáctenos</a></li>
              <li class="nav-item">
                <button class="btn btn-login-nav" data-bs-toggle="modal" data-bs-target="#loginModal">Ingresar</button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5" style="min-height: 70vh;">
      
      <div id="seccion-seguimiento"></div>

      <div class="row g-4">
        <div class="col-12 col-lg-7">
          <div id="contenedor-productos"></div>
        </div>

        <div class="col-12 col-lg-5">
          <div id="contenedor-carrito"></div>
        </div>
      </div>

    </main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="mb-1">Panify - Distribuciones Oro Pan</p>
        <small class="text-white-50">3315796 | ADSO - Grupo 4 — SENA 2026</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../src/js/client/pedidos.js"></script>
  </body>
</html>
