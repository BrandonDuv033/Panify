<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Panify - Distribuidora de Pan</title>
    <link rel="icon" href="/src/img/Icono Panify.png" type="image/png" />
    <!-- BootStrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- CSS -->
     <link rel="stylesheet" href="../src/css/index.css">
    <link rel="stylesheet" href="../src/css/productos.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-panify">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-center gap-3">
            <img
              src="/src/img/Logo Panify.png"
              alt="Logo Panify"
              class="logo"
            />
            <span class="marca"
              >Pani<span class="marca marca-dos">fy</span></span
            >
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-5">
              <li class="nav-item">
                <a class="nav-link opcion-menu" href="/index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link opcion-menu" href="/client/productos.html"
                  >Productos</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link opcion-menu" href="#">Contáctenos</a>
              </li>
              <li class="nav-item">
                <button
                  class="btn btn-login-nav"
                  data-bs-toggle="modal"
                  data-bs-target="#loginModal"
                >
                  Ingresar
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-login">
          <div class="modal-header border-0">
            <h2 class="modal-title w-100 text-center">Iniciar Sesión</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form action="">
              <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fa-regular fa-envelope"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Ingresa tu correo"
                    required
                  />
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label"> Contraseña </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fa-solid fa-key"></i>
                  </span>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Ingresa tu Contraseña"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="btn btn-login-ingresar w-100">
                Ingresar
              </button>

              <div class="d-flex justify-content-between mt-3 mb-3">
                <a href="#" class="link-login">¿Olvidaste tu contraseña?</a>
                <a href="registro.html" class="link-login">Regístrate</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <main class="container py-5">
      <!-- Título de la página -->
      <div class="text-center mb-5">
        <h1>Nuestros Productos</h1>

        <p class="text-muted">
          Escoge tus productos favoritos y agrégalos al carrito.
        </p>
      </div>

      <!-- Barra de búsqueda -->
      <div class="row mb-4">
        <div class="col-md-8">
          <input
            type="text"
            class="form-control"
            id="buscarProducto"
            placeholder="Buscar producto..."
          />
        </div>

        <div class="col-md-4">
          <select class="form-select" id="categoria">
            <option value="">Todas las categorías</option>
            <option>Pan</option>
            <option>Pastelería</option>
          </select>
        </div>
      </div>

      <!-- Aquí aparecerán los productos -->
      <div class="row" id="listaProductos"></div>
      <div class="col-lg-4">
        <div class="card shadow">
          <div class="card-header">
            <h4>
              <i class="fa-solid fa-cart-shopping"></i>
              Carrito
            </h4>
          </div>

          <div class="card-body" id="carrito">
            <p class="text-center text-muted">El carrito está vacío.</p>
          </div>

          <div class="card-footer">
            <button class="btn btn-danger w-100 mt-2" onclick="vaciarCarrito()">
              Vaciar carrito
            </button>
            <h5>
              Total:
              <span id="total">$ 0</span>
            </h5>
            <button
              class="btn btn-success w-100 mt-2"
              onclick="finalizarCompra()"
            >
              Finalizar compra
            </button>
            <button
              class="btn btn-primary w-100 mt-2"
              onclick="generarRecibo()"
            >
              Generar recibo
            </button>
          </div>
        </div>
      </div>
      <!-- RECIBO DE COMPRA -->
      <div id="recibo" class="card mt-3 p-3 d-none">
        <h4>Recibo de compra</h4>

        <div id="reciboDetalle"></div>

        <h5 id="reciboTotal"></h5>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/a0994db117.js"
      crossorigin="anonymous"
    ></script>
    <script src="/src/js/client/productos.js"></script>
  </body>
</html>
